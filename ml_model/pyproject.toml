[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strawberry-rul"
version = "1.1.0"
description = "Strawberry image RUL inference from a trained MobileNetV2-CBAM-GRU checkpoint"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "torchvision", "numpy", "opencv-python"]

[project.scripts]
strawberry-predict = "strawberry_rul.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
